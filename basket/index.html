<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Box 3 Area</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h3>Boxes</h3>
            <div class="box-list drop-zone" id="source-list"></div>
        </aside>

        <div class="areas">
            <div class="area" id="area-1">
                <h3>Area 1 (1-4)</h3>
                <div class="box-list drop-zone" data-min="1" data-max="4"></div>
            </div>

            <div class="area" id="area-2">
                <h3>Area 2 (5-8)</h3>
                <div class="box-list drop-zone" data-min="5" data-max="8"></div>
            </div>

            <div class="area" id="area-3">
                <h3>Area 3 (9-12)</h3>
                <div class="box-list drop-zone" data-min="9" data-max="12"></div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
